[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavesleuth-devito"
version = "1.0.0"
description = "A compact Devito-backed inverse-wave playground for hidden 2D media."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aryan Gupta"}]
keywords = ["devito", "wave-equation", "inverse-problems", "simulation", "acoustics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.6"
]

[project.urls]
Repository = "https://github.com/guptaaryanr/wavesleuth-devito"
Issues = "https://github.com/guptaaryanr/wavesleuth-devito/issues"

[project.optional-dependencies]
devito = ["devito>=4.8"]
test = ["pytest>=7"]
all = ["devito>=4.8", "pytest>=7"]

[project.scripts]
wavesleuth-devito = "wavesleuth_devito.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "devito: tests that require Devito and may compile a tiny operator"
]
